[alembic]
# Onde ficam os arquivos de migração gerados.
script_location = alembic

# sqlalchemy.url fica vazio de propósito: alembic/env.py lê a URL real do
# banco a partir de app.config.configuracoes (que por sua vez lê da
# variável de ambiente DATABASE_URL / do .env), em vez de duplicar esse
# valor aqui. Ter a URL do banco em dois lugares é como ela acaba
# divergindo silenciosamente entre "rodar a API" e "rodar uma migração".
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
