# Orquestra os três serviços que já existem nesta etapa do projeto: o
# banco de dados, a API e o worker de notificação (Etapa 5.2). O frontend
# (Etapa 1.5, React/Vite) ainda não entra aqui -- ele hoje é só ferramental
# (ver frontend/), sem uma imagem de produção que faça sentido empacotar;
# isso é conteúdo da Etapa 7 ("Entrega — API, PWA, testes e Docker").
services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      # Exposto no host (não só na rede interna do compose) para permitir
      # rodar a API fora do Docker durante o desenvolvimento (ex.: com
      # debugger anexado no editor) enquanto o banco roda containerizado.
      - "5432:5432"
    volumes:
      # Sem isso, os dados do Postgres viveriam só dentro do container e
      # sumiriam a cada `docker compose down` -- o volume nomeado
      # sobrevive a isso, e só é apagado com `docker compose down -v`.
      - dados_do_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      # Host "banco", não "localhost": dentro da rede do compose, cada
      # serviço se enxerga pelo próprio nome -- é assim que a API alcança
      # o Postgres do serviço acima.
      DATABASE_URL: postgresql+psycopg2://kanban:kanban@banco:5432/kanban
      CHAVE_SECRETA: troque-esta-chave-antes-de-qualquer-deploy
      # Precisa ser IGUAL à do serviço `worker` abaixo -- é o segredo
      # compartilhado que autentica a chamada dele para
      # POST /interno/eventos-tempo-real (Etapa 6.5).
      CHAVE_INTERNA: troque-esta-chave-interna-tambem
      # Etapa 7.5: a origem de onde o frontend publicado tem permissão de
      # chamar esta API pelo navegador. O padrão cobre rodar o frontend
      # localmente com `npm run dev`; sobrescreva com a URL real de
      # produção quando publicar o frontend em algum lugar.
      ORIGENS_PERMITIDAS_CORS: ${ORIGENS_PERMITIDAS_CORS:-http://localhost:5173}
      # true só na implantação com frontend e API em domínios diferentes
      # (ver docs/implantacao.md, app/config.py) -- ausente/false aqui
      # significa "mesma origem", o padrão seguro para rodar isto local.
      COOKIE_ENTRE_SITES: ${COOKIE_ENTRE_SITES:-false}
      # A API também serve a chave pública em GET /assinaturas-push/chave-publica
      # (o frontend a usa para registrar push no navegador) -- por isso
      # precisa da mesma variável que o serviço `worker` recebe abaixo,
      # não só a privada.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      banco:
        # Espera o Postgres responder a `pg_isready` (o healthcheck acima)
        # antes de subir a API -- sem isso, a API poderia tentar conectar
        # antes do banco estar pronto para aceitar conexões, na primeira
        # subida do ambiente.
        condition: service_healthy

  worker:
    # Mesma imagem da API (mesmo Dockerfile, mesmo requirements.txt) --
    # API e worker compartilham modelos e dependências (Etapa 5.2). O que
    # os diferencia é só o `command` abaixo, que troca o servidor HTTP
    # pelo laço "acorda, consulta, envia, dorme" de backend/worker/.
    build: ./backend
    command: ["python", "-m", "worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://kanban:kanban@banco:5432/kanban
      CHAVE_SECRETA: troque-esta-chave-antes-de-qualquer-deploy
      # Mesmo valor do serviço `api` acima -- ver o comentário lá.
      CHAVE_INTERNA: troque-esta-chave-interna-tambem
      # Host "api", não "localhost": mesma lógica de sempre dentro da rede
      # do compose. Sem isto certo, a ponte da Etapa 6.5 (worker → sala em
      # tempo real) simplesmente não encontra a API -- mas, sendo
      # best-effort (ver worker/tempo_real.py), o worker continua
      # funcionando normalmente mesmo assim, só sem o aviso in-app.
      URL_API_INTERNA: http://api:8000
      # Sem estas três, o worker sobe e roda normalmente -- só o envio de
      # push de verdade fica desativado (ver backend/.env.example).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contato@example.com}
    depends_on:
      banco:
        condition: service_healthy
      # Não `condition: service_healthy` (a API não tem healthcheck
      # definido) -- só ordem de subida. A ponte é best-effort, então não
      # vale a complexidade de esperar a API responder de verdade.
      api:
        condition: service_started
    # Sem `ports`: o worker não escuta nada -- é a diferença defendida na
    # Etapa 5.2, "processo que executa trabalho por tempo, não por
    # requisição". Não há requisição nenhuma para ele responder.

volumes:
  dados_do_banco:
