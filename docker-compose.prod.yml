# Override de produção (VPS) -- usar SEMPRE junto do docker-compose.yml,
# nunca sozinho (ver docs/implantacao.md, seção 3.5/3.6):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Só existe por um motivo: o docker-compose.yml de desenvolvimento publica
# as portas do Postgres (5432) e da API (8000) em TODAS as interfaces de
# rede (0.0.0.0) -- correto numa máquina local atrás de um roteador
# doméstico, errado numa VPS com IP público, onde isso exporia o banco de
# dados direto para a internet. Este override restringe as duas a
# responder só em 127.0.0.1: o Caddy (o proxy reverso que fala HTTPS com
# o mundo, rodando fora do Docker nessa mesma máquina) continua
# alcançando a API por `localhost:8000` normalmente; ninguém de fora
# alcança a API ou o banco diretamente.
#
# Atenção: regras de firewall (ufw) sozinhas NÃO bastam aqui -- o Docker
# manipula o iptables por conta própria e, em muitas configurações
# padrão, ignora as regras do ufw para portas que ele mesmo publica.
# Restringir a porta publicada em si (o que este arquivo faz) é o jeito
# confiável.
services:
  banco:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "127.0.0.1:8000:8000"
